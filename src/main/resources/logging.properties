# Skicka loggar både till fil och till konsolen
handlers = java.util.logging.FileHandler, java.util.logging.ConsoleHandler

# Lägsta nivå som loggas alls (FINE = DEBUG)
.level = FINE

# Filen: alla nivåer från FINE och uppåt, läggs till sist i filen
java.util.logging.FileHandler.pattern = budget.log
java.util.logging.FileHandler.level = FINE
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.encoding = UTF-8
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

# Konsolen: bara WARNING och SEVERE, så att menyn inte störs
java.util.logging.ConsoleHandler.level = WARNING

# En rad per logg: datum tid NIVÅ [klass] meddelande
java.util.logging.SimpleFormatter.format = %1$tF %1$tT %4$-7s [%3$s] %5$s%n